name: devsecops-pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: '948834064527'
  IMAGE_NAME: django-heroes
  ECR_REPO: my-repo

jobs:
  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - uses: hadolint/hadolint-action@v3.1.0

  checkov:
    name: IaC & Config Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: dockerfile,github_actions
          soft_fail: true

  gitleaks:
    name: Secrets Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - name: Run Gitleaks (JSON)
        run: |
          docker run --rm \
            -v "$(pwd):/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source . --report-format json --report-path gitleaks-report.json --redact --exit-code 1

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit

      - name: Audit application dependencies
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt

  sast-codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
          semgrep scan --config p/django --config p/python --error myproject/

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sbom-source:
    name: Generate Source SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate Source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: cyclonedx-json
          output-file: sbom-source.cdx.json
          artifact-name: django-heroes-source-sbom

  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Run Django tests with coverage
        run: |
          coverage run --source='myproject/avengers' myproject/manage.py test avengers
          coverage report -m

      - name: Generate HTML coverage report
        if: always()
        run: coverage html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: django-heroes-coverage
          path: htmlcov/
          retention-days: 1

  build-push-image:
    name: Build and Push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - dockerfile-lint
      - checkov
      - gitleaks
      - dependency-scan
      - sast-codeql
      - semgrep
      - sonarqube
      - unit-tests

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Docker Login
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # - name: Configure AWS Credentials
      #   uses: aws-actions/configure-aws-credentials@v6.3.0
      #   with:
      #     aws-region: ${{ env.AWS_REGION }}
      #     role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/aws-github-role

      # - name: Login to Amazon ECR
      #   id: login-ecr
      #   uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push amd64 image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest

      - name: Generate Container Image SBOM
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          image: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
          artifact-name: django-heroes-image-sbom

      - name: Trivy Container Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
          #image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Sign Docker Image
        continue-on-error: true
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify Docker Image Signature
        continue-on-error: true
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/devsecops-pipeline.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"

  smoke-and-dast:
    name: Smoke Test & OWASP ZAP DAST
    runs-on: ubuntu-latest
    needs: [build-push-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      NET_NAME: smoke-dast-net
      CONTAINER_NAME: smoke-django-heroes
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Run container smoke test
        env:
          IMAGE_REF: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
        run: |
          docker network create "${NET_NAME}"

          docker run -d --name "${CONTAINER_NAME}" --network "${NET_NAME}" \
            -e DJANGO_SETTINGS_MODULE="myproject.settings" \
            -e SECRET_KEY="ci-smoke-dast-secret-key" \
            -e DEBUG="1" \
            -e ALLOWED_HOSTS="*" \
            "${IMAGE_REF}"

          CURRENT_USER=$(docker exec "${CONTAINER_NAME}" id -un)
          echo "Container user: ${CURRENT_USER}"

          docker exec "${CONTAINER_NAME}" python manage.py check

          READY=0
          for i in $(seq 1 20); do
            if docker exec "${CONTAINER_NAME}" python -c \
              "import urllib.request; req = urllib.request.Request('http://127.0.0.1:8000/', headers={'Host': 'localhost'}); resp = urllib.request.urlopen(req, timeout=2); print('HTTP status:', resp.status)" \
              2>/dev/null; then
              echo "Smoke check passed on attempt ${i}"
              READY=1
              break
            fi
            sleep 2
          done

          if [ "${READY}" -ne 1 ]; then
            echo "ERROR: Django container did not become ready in time"
            exit 1
          fi

      - name: Run OWASP ZAP baseline scan
        run: |
          REPORT_DIR="$(pwd)/zap-report"
          mkdir -p "${REPORT_DIR}"
          chmod 777 "${REPORT_DIR}"

          docker run --rm --network "${NET_NAME}" \
            -v "${REPORT_DIR}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "http://${CONTAINER_NAME}:8000" \
            -r zap-report.html \
            -J zap-report.json \
            -I

      - name: Cleanup container and network
        if: always()
        run: |
          docker logs "${CONTAINER_NAME}" 2>&1 || true
          docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
          docker network rm "${NET_NAME}" >/dev/null 2>&1 || true

      - name: Upload ZAP DAST Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: django-heroes-zap-report
          path: zap-report/