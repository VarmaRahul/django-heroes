name: pipeline

on:
  push:
    branches: main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: '948834064527'
  IMAGE_NAME: django-heroes
  ECR_REPO: my-repo

jobs:
  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          ignore: DL3008,DL3018,DL3059

  gitleaks:
    name: Secrets Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2

  sast-codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - uses: github/codeql-action/init@v4
        with:
          languages: python

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install pip-audit pip-licenses

      - run: pip-audit

  build:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: [dockerfile-lint, gitleaks, sast-codeql, dependency-scan]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Docker Login
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/aws-github-role

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest
