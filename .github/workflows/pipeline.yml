name: pipeline

on:
  push:
    branches: [ $default-branch ]
  pull_request: 
    branches: [ $default-branch ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  Build:

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Image Build
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $IMAGE_TAG .
