apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: django-heroes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VarmaRahul/django-heroes.git
    targetRevision: main
    path: deployment/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: project
  syncPolicy:
    automated:
      prune: true
      selfHeal: true